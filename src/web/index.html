<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSoma</title>
  <link rel="stylesheet" href="/sidebar.css">
  <style>
    body { margin: 0; background: #0a0a0f; color: #e4e4e7; font-family: system-ui, sans-serif; }
    main { margin-left: 56px; height: 100vh; display: flex; flex-direction: column; transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    .shared-sidebar.expanded ~ main { margin-left: 240px; }
    .top-bar { height: 48px; padding: 0 20px; border-bottom: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; background: #111118; }
    .top-bar-info { display: flex; align-items: center; gap: 16px; font-size: 12px; color: #71717a; }
    .page-content { flex: 1; overflow-y: auto; padding: 20px; }
    .card { background: #111118; border: 1px solid #27272a; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: #111118; border: 1px solid #27272a; border-radius: 12px; padding: 16px; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 12px; color: #71717a; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .badge-ok { background: rgba(34,197,94,0.15); color: #22c55e; }
    .badge-error { background: rgba(239,68,68,0.15); color: #ef4444; }
    .badge-warn { background: rgba(234,179,8,0.15); color: #eab308; }
    .badge-disabled { background: rgba(113,113,122,0.15); color: #71717a; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; font-weight: 600; color: #71717a; border-bottom: 1px solid #27272a; }
    td { padding: 8px 12px; border-bottom: 1px solid #27272a; color: #a1a1aa; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid #27272a; background: #18181b; color: #e4e4e7; transition: all 0.15s; }
    .btn:hover { background: #27272a; }
    .btn-primary { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .btn-primary:hover { background: #6d28d9; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .toggle-switch { position: relative; width: 36px; height: 20px; background: #27272a; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
    .toggle-switch.on { background: #7c3aed; }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: left 0.2s; }
    .toggle-switch.on::after { left: 18px; }
    .empty-state { text-align: center; padding: 48px 20px; color: #71717a; }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .monospace { font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace; font-size: 12px; }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="shared-sidebar">
    <div class="shared-sidebar-header">
      <div class="shared-sidebar-logo">SM</div>
      <div class="shared-sidebar-brand">
        <span class="shared-sidebar-brand-name">OpenSoma</span>
        <span class="shared-sidebar-brand-version">v0.1.0</span>
      </div>
      <button class="shared-sidebar-toggle">◀</button>
    </div>
    <nav class="shared-sidebar-nav">
      <!-- Core -->
      <div>
        <div class="shared-sidebar-group-label"><span>Core</span><div class="group-dash"></div></div>
        <a href="#dashboard" class="shared-sidebar-item active" data-page="dashboard">
          <span class="shared-sidebar-icon">⊞</span>
          <span class="shared-sidebar-label">Dashboard</span>
        </a>
      </div>
      <!-- Data -->
      <div>
        <div class="shared-sidebar-group-label"><span>Data</span><div class="group-dash"></div></div>
        <a href="#connectors" class="shared-sidebar-item" data-page="connectors">
          <span class="shared-sidebar-icon">🔌</span>
          <span class="shared-sidebar-label">Connectors</span>
        </a>
        <a href="#collectors" class="shared-sidebar-item" data-page="collectors">
          <span class="shared-sidebar-icon">📡</span>
          <span class="shared-sidebar-label">Collectors</span>
        </a>
        <a href="#events" class="shared-sidebar-item" data-page="events">
          <span class="shared-sidebar-icon">📋</span>
          <span class="shared-sidebar-label">Events</span>
        </a>
        <a href="#sync" class="shared-sidebar-item" data-page="sync">
          <span class="shared-sidebar-icon">🔄</span>
          <span class="shared-sidebar-label">Sync</span>
        </a>
      </div>
      <!-- Operations -->
      <div>
        <div class="shared-sidebar-group-label"><span>Operations</span><div class="group-dash"></div></div>
        <a href="#monitor" class="shared-sidebar-item" data-page="monitor">
          <span class="shared-sidebar-icon">📊</span>
          <span class="shared-sidebar-label">Monitor</span>
        </a>
        <a href="#doctor" class="shared-sidebar-item" data-page="doctor">
          <span class="shared-sidebar-icon">🩺</span>
          <span class="shared-sidebar-label">Diagnostics</span>
        </a>
        <a href="#config" class="shared-sidebar-item" data-page="config">
          <span class="shared-sidebar-icon">⚙</span>
          <span class="shared-sidebar-label">Config</span>
        </a>
        <a href="#plugins" class="shared-sidebar-item" data-page="plugins">
          <span class="shared-sidebar-icon">🧩</span>
          <span class="shared-sidebar-label">Plugins</span>
        </a>
        <a href="#logs" class="shared-sidebar-item" data-page="logs">
          <span class="shared-sidebar-icon">📋</span>
          <span class="shared-sidebar-label">Logs</span>
        </a>
      </div>
    </nav>
    <div class="shared-sidebar-footer">
      <div class="shared-sidebar-user">
        <div class="shared-sidebar-avatar">S</div>
        <div class="shared-sidebar-user-info">
          <span class="shared-sidebar-user-name">System</span>
          <span class="shared-sidebar-user-role" id="sidebar-status">Soma Node</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <header class="top-bar">
      <h1 id="page-title" style="font-size:16px;font-weight:600;margin:0;">Dashboard</h1>
      <div class="top-bar-info">
        <span>Version <span class="monospace">0.1.0</span></span>
        <span>Uptime <span class="monospace" id="uptime">-</span></span>
        <span>Status <span class="monospace" id="header-status" style="color:#22c55e;">-</span></span>
      </div>
    </header>
    <div class="page-content" id="page-content">
      <!-- Dynamic content loaded here -->
    </div>
  </main>

  <script src="/sidebar.js"></script>
  <script>
    const API = window.location.origin + '/api';

    // ─── Fetch helper ───────────────────────────────────────
    async function apiFetch(path) {
      try {
        const resp = await fetch(API + path);
        if (resp.ok) return await resp.json();
      } catch (e) { /* ignore */ }
      return null;
    }

    function formatUptime(secs) {
      if (!secs && secs !== 0) return '-';
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      if (h > 0) return h + 'h ' + m + 'm';
      return m + 'm ' + (secs % 60) + 's';
    }

    // ─── Page Renderers ─────────────────────────────────────
    async function renderDashboard() {
      const status = await apiFetch('/status');
      const cacheStats = await apiFetch('/cache/stats');
      const connectors = await apiFetch('/connectors') || [];

      const activeCount = connectors.filter(c => c.status === 'running').length;
      const totalEvents = status ? status.events_collected : 0;
      const syncedEvents = status ? status.events_synced : 0;
      const pending = cacheStats ? cacheStats.pending : 0;

      return `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${activeCount}</div>
            <div class="stat-label">Active Connectors</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${totalEvents.toLocaleString()}</div>
            <div class="stat-label">Collected Events</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${syncedEvents.toLocaleString()}</div>
            <div class="stat-label">Synced Events</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${pending.toLocaleString()}</div>
            <div class="stat-label">Pending</div>
          </div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:14px;font-weight:600;">System Info</h3>
          <table>
            <tbody>
              <tr><td style="color:#71717a;width:120px;">Node ID</td><td class="monospace">${status ? status.node_id : '-'}</td></tr>
              <tr><td style="color:#71717a;">Hostname</td><td class="monospace">${status ? status.hostname : '-'}</td></tr>
              <tr><td style="color:#71717a;">IP Address</td><td class="monospace">${status ? status.ip : '-'}</td></tr>
              <tr><td style="color:#71717a;">CPU</td><td class="monospace">${status ? status.cpu_percent.toFixed(1) + '%' : '-'}</td></tr>
              <tr><td style="color:#71717a;">Memory</td><td class="monospace">${status ? status.memory_used_mb + ' / ' + status.memory_total_mb + ' MB' : '-'}</td></tr>
            </tbody>
          </table>
        </div>
        ${status && status.last_error ? '<div class="card" style="border-color:#ef444440;"><span style="color:#ef4444;">⚠ ' + status.last_error + '</span></div>' : ''}
      `;
    }

    async function renderConnectors() {
      const connectors = await apiFetch('/connectors') || [];
      let rows = connectors.map(c => `
        <tr>
          <td style="font-weight:500;">${c.name}</td>
          <td class="monospace">${c.id}</td>
          <td><span class="badge ${c.status === 'running' ? 'badge-ok' : c.status === 'disabled' ? 'badge-disabled' : 'badge-error'}">${c.status}</span></td>
          <td class="monospace">${c.event_count.toLocaleString()}</td>
          <td>
            <div class="toggle-switch ${c.enabled ? 'on' : ''}" data-connector="${c.id}" onclick="toggleConnector('${c.id}', this)"></div>
          </td>
        </tr>
      `).join('');

      return `
        <h2 style="font-size:14px;font-weight:600;margin:0 0 16px;">Connector Manager</h2>
        <table>
          <thead><tr><th>Name</th><th>ID</th><th>Status</th><th>Events</th><th>Enabled</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function renderCollectors() {
      const collectors = await apiFetch('/collectors') || [];
      let rows = collectors.map(c => `
        <tr>
          <td style="font-weight:500;">${c.name}</td>
          <td class="monospace">${c.id}</td>
          <td><span class="badge ${c.status === 'running' ? 'badge-ok' : 'badge-error'}">${c.status}</span></td>
          <td class="monospace">${c.event_count.toLocaleString()}</td>
        </tr>
      `).join('');

      return `
        <h2 style="font-size:14px;font-weight:600;margin:0 0 16px;">Collector Status</h2>
        <table>
          <thead><tr><th>Name</th><th>ID</th><th>Status</th><th>Events</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function renderSync() {
      const cacheStats = await apiFetch('/cache/stats');
      const status = await apiFetch('/status');
      const cfg = await apiFetch('/config');
      const pipeline = await apiFetch('/pipeline/metrics');

      const batchSize = cfg ? cfg.sync_batch_size : '-';
      const uploadInterval = cfg ? cfg.sync_upload_interval : '-';
      const maxRetries = cfg ? cfg.sync_max_retries : '-';
      const retryBackoff = cfg ? cfg.sync_retry_backoff_ms : '-';
      const cacheLimit = cfg ? cfg.sync_cache_size_mb : '-';
      const conflictStrategy = cfg ? cfg.conflict_strategy || 'newest_wins' : '-';
      const streaming = cfg ? cfg.sync_streaming : false;

      const processed = pipeline ? (pipeline.events_processed || 0).toLocaleString() : '-';
      const normalized = pipeline ? (pipeline.events_normalized || 0).toLocaleString() : '-';
      const classified = pipeline ? (pipeline.events_classified || 0).toLocaleString() : '-';
      const enriched = pipeline ? (pipeline.events_enriched || 0).toLocaleString() : '-';
      const deduped = pipeline ? (pipeline.events_deduped || 0).toLocaleString() : '-';

      return `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${cacheStats ? cacheStats.total.toLocaleString() : '-'}</div>
            <div class="stat-label">Total Cached</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${cacheStats ? cacheStats.uploaded.toLocaleString() : '-'}</div>
            <div class="stat-label">Uploaded</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${cacheStats ? cacheStats.pending.toLocaleString() : '-'}</div>
            <div class="stat-label">Pending Upload</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${cacheStats ? (cacheStats.cache_size_bytes / 1024 / 1024).toFixed(1) + ' MB' : '-'}</div>
            <div class="stat-label">Cache Size</div>
          </div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:14px;font-weight:600;">Sync Engine</h3>
          <table>
            <tbody>
              <tr><td style="color:#71717a;width:120px;">Sync Status</td><td><span class="badge badge-ok">Running</span></td></tr>
              <tr><td style="color:#71717a;">Batch Size</td><td class="monospace">${batchSize}</td></tr>
              <tr><td style="color:#71717a;">Upload Interval</td><td class="monospace">${uploadInterval}s</td></tr>
              <tr><td style="color:#71717a;">Max Retries</td><td class="monospace">${maxRetries}</td></tr>
              <tr><td style="color:#71717a;">Backoff</td><td class="monospace">${retryBackoff}ms</td></tr>
              <tr><td style="color:#71717a;">Cache Limit</td><td class="monospace">${cacheLimit} MB</td></tr>
              <tr><td style="color:#71717a;">Conflict Strategy</td><td class="monospace">${conflictStrategy}</td></tr>
              <tr><td style="color:#71717a;">Streaming</td><td><span class="badge ${streaming ? 'badge-ok' : 'badge-disabled'}">${streaming ? 'Enabled' : 'Disabled'}</span></td></tr>
            </tbody>
          </table>
        </div>
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:14px;font-weight:600;">Pipeline</h3>
          <table>
            <tbody>
              <tr><td style="color:#71717a;width:120px;">Processed</td><td class="monospace">${processed}</td></tr>
              <tr><td style="color:#71717a;">Normalized</td><td class="monospace">${normalized}</td></tr>
              <tr><td style="color:#71717a;">Classified</td><td class="monospace">${classified}</td></tr>
              <tr><td style="color:#71717a;">Enriched</td><td class="monospace">${enriched}</td></tr>
              <tr><td style="color:#71717a;">Deduped</td><td class="monospace">${deduped}</td></tr>
            </tbody>
          </table>
        </div>
        <button class="btn" onclick="evictCache()">🗑 Evict Cache</button>
      `;
    }

    async function renderMonitor() {
      const status = await apiFetch('/status');
      const connectors = await apiFetch('/connectors') || [];
      const sysInfo = await apiFetch('/system/info');

      const cpuCores = sysInfo ? sysInfo.cpu.cores : '-';
      const cpuBrand = sysInfo ? sysInfo.cpu.brand : '';
      const memPct = sysInfo ? sysInfo.memory.usage_percent : '-';
      const memAvail = sysInfo ? sysInfo.memory.available_mb : '-';
      const osName = sysInfo ? sysInfo.os : '-';
      const kernel = sysInfo ? sysInfo.kernel : '-';
      const disks = sysInfo ? sysInfo.disks : [];
      const networks = sysInfo ? sysInfo.networks : [];

      let diskRows = disks.map(d => `<tr><td class="monospace">${d.mount}</td><td>${d.total_gb} GB</td><td>${d.available_gb} GB</td><td>${d.filesystem}</td></tr>`).join('');
      let netRows = networks.slice(0, 6).map(n => `<tr><td class="monospace">${n.name}</td><td>${(n.rx_bytes/1024/1024).toFixed(1)} MB</td><td>${(n.tx_bytes/1024/1024).toFixed(1)} MB</td></tr>`).join('');

      return `
        <h2 style="font-size:14px;font-weight:600;margin:0 0 16px;">System Monitor</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" style="color:#22c55e;">${status ? status.cpu_percent.toFixed(1) + '%' : '-'}</div>
            <div class="stat-label">CPU Usage (${cpuCores} cores)</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${memPct}%</div>
            <div class="stat-label">Memory Usage (${memAvail} MB Available)</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${connectors.filter(c => c.status === 'running').length} / ${connectors.length}</div>
            <div class="stat-label">Connectors Online</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${formatUptime(status ? status.uptime_seconds : 0)}</div>
            <div class="stat-label">Uptime</div>
          </div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:14px;font-weight:600;">System Info</h3>
          <table>
            <tbody>
              <tr><td style="color:#71717a;width:120px;">OS</td><td class="monospace">${osName}</td></tr>
              <tr><td style="color:#71717a;">Kernel</td><td class="monospace">${kernel}</td></tr>
              <tr><td style="color:#71717a;">CPU</td><td class="monospace">${cpuBrand} (${cpuCores} cores)</td></tr>
            </tbody>
          </table>
        </div>
        ${diskRows ? '<div class="card"><h3 style="margin:0 0 12px;font-size:14px;font-weight:600;">Disk Usage</h3><table><thead><tr><th>Mount</th><th>Total</th><th>Available</th><th>Filesystem</th></tr></thead><tbody>' + diskRows + '</tbody></table></div>' : ''}
        ${netRows ? '<div class="card"><h3 style="margin:0 0 12px;font-size:14px;font-weight:600;">Network Interfaces</h3><table><thead><tr><th>Interface</th><th>RX</th><th>TX</th></tr></thead><tbody>' + netRows + '</tbody></table></div>' : ''}
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:14px;font-weight:600;">Recent Events</h3>
          <div id="recent-events" style="font-size:13px;color:#71717a;">Loading...</div>
        </div>
        <div class="card">
          <h3 style="margin:0 0 12px;font-size:14px;font-weight:600;">Prometheus Metrics</h3>
          <p style="font-size:12px;color:#71717a;margin:0;">Visit <a href="/metrics" style="color:#7c3aed;">/metrics</a> View Prometheus metrics in Prometheus format</p>
        </div>
      `;
    }

    async function renderConfig() {
      const cfg = await apiFetch('/config');
      if (!cfg || cfg.error) {
        return `<div class="empty-state"><div class="icon">⚙</div><p>${cfg ? cfg.message || cfg.error : 'Failed to load config'}</p></div>`;
      }

      const connectorRows = (cfg.connectors || []).map(c =>
        `<tr><td style="font-weight:500;">${c.name}</td><td><span class="badge ${c.enabled ? 'badge-ok' : 'badge-disabled'}">${c.enabled ? 'Enabled' : 'Disabled'}</span></td></tr>`
      ).join('');

      return `
        <h2 style="font-size:14px;font-weight:600;margin:0 0 16px;">Runtime Configuration</h2>
        <div class="card">
          <h3 style="margin:0 0 16px;font-size:14px;font-weight:600;">Daemon</h3>
          <table><tbody>
            <tr><td style="color:#71717a;width:120px;">Node ID</td><td class="monospace">${cfg.node_id}</td></tr>
            <tr><td style="color:#71717a;">Log Level</td><td class="monospace">${cfg.log_level}</td></tr>
            <tr><td style="color:#71717a;">Data Directory</td><td class="monospace">${cfg.data_dir}</td></tr>
            <tr><td style="color:#71717a;">Status Port</td><td class="monospace">${cfg.status_port}</td></tr>
          </tbody></table>
        </div>
        <div class="card">
          <h3 style="margin:0 0 16px;font-size:14px;font-weight:600;">Soul Connection</h3>
          <table><tbody>
            <tr><td style="color:#71717a;width:120px;">Endpoint</td><td class="monospace">${cfg.soul_endpoint}</td></tr>
            <tr><td style="color:#71717a;">Heartbeat</td><td class="monospace">${cfg.heartbeat_interval}s</td></tr>
            <tr><td style="color:#71717a;">Connect Timeout</td><td class="monospace">${cfg.connect_timeout}s</td></tr>
          </tbody></table>
        </div>
        <div class="card">
          <h3 style="margin:0 0 16px;font-size:14px;font-weight:600;">Collectors</h3>
          <table><tbody>
            <tr><td style="color:#71717a;width:120px;">Watch Dirs</td><td class="monospace">${(cfg.watch_dirs || []).join(', ') || '(none)'}</td></tr>
            <tr><td style="color:#71717a;">Include</td><td class="monospace">${(cfg.include_patterns || []).join(', ')}</td></tr>
            <tr><td style="color:#71717a;">Exclude</td><td class="monospace">${(cfg.exclude_patterns || []).join(', ') || '(none)'}</td></tr>
            <tr><td style="color:#71717a;">Debounce</td><td class="monospace">${cfg.debounce_ms}ms</td></tr>
            <tr><td style="color:#71717a;">Process Poll</td><td class="monospace">${cfg.process_interval_ms}ms</td></tr>
            <tr><td style="color:#71717a;">Network Poll</td><td class="monospace">${cfg.network_interval_ms}ms</td></tr>
            <tr><td style="color:#71717a;">Clipboard Poll</td><td class="monospace">${cfg.clipboard_interval_ms}ms</td></tr>
          </tbody></table>
        </div>
        <div class="card">
          <h3 style="margin:0 0 16px;font-size:14px;font-weight:600;">Sync Settings</h3>
          <table><tbody>
            <tr><td style="color:#71717a;width:120px;">Batch Size</td><td class="monospace">${cfg.sync_batch_size}</td></tr>
            <tr><td style="color:#71717a;">Upload Interval</td><td class="monospace">${cfg.sync_upload_interval}s</td></tr>
            <tr><td style="color:#71717a;">Max Retries</td><td class="monospace">${cfg.sync_max_retries}</td></tr>
            <tr><td style="color:#71717a;">Backoff</td><td class="monospace">${cfg.sync_retry_backoff_ms}ms</td></tr>
            <tr><td style="color:#71717a;">Cache Limit</td><td class="monospace">${cfg.sync_cache_size_mb} MB</td></tr>
          </tbody></table>
        </div>
        ${connectorRows ? '<div class="card"><h3 style="margin:0 0 16px;font-size:14px;font-weight:600;">Connector Config</h3><table><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody>' + connectorRows + '</tbody></table></div>' : ''}
        <p style="font-size:12px;color:#71717a;margin-top:12px;">Config is <code class="monospace">config.toml</code> managed via config.toml (hot-reload). Secrets redacted.</p>
      `;
    }

    async function renderPlugins() {
      const data = await apiFetch('/plugins');
      if (!data) return '<div class="empty-state"><div class="icon">🧩</div><p>Failed to load plugin info</p></div>';

      const plugins = data.plugins || [];
      const health = data.health || [];

      if (plugins.length === 0) {
        return `
          <h2 style="font-size:14px;font-weight:600;margin:0 0 16px;">Plugin Manager</h2>
          <div class="empty-state"><div class="icon">🧩</div><p>No plugins registered</p></div>
        `;
      }

      const healthMap = {};
      health.forEach(h => { healthMap[h.plugin_id] = h; });

      let rows = plugins.map(p => {
        const h = healthMap[p.id] || {};
        const stateClass = p.state === 'active' ? 'badge-ok' : p.state === 'error' ? 'badge-error' : 'badge-disabled';
        return `
          <tr>
            <td style="font-weight:500;">${p.name || p.id}</td>
            <td class="monospace">${p.id}</td>
            <td><span class="badge ${stateClass}">${p.state || 'unknown'}</span></td>
            <td class="monospace">${p.version || '-'}</td>
            <td class="monospace">${h.requests_handled || 0}</td>
            <td class="monospace">${h.errors || 0}</td>
          </tr>
        `;
      }).join('');

      return `
        <h2 style="font-size:14px;font-weight:600;margin:0 0 16px;">Plugin Manager</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${data.total}</div>
            <div class="stat-label">Registered Plugins</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" style="color:#22c55e;">${data.active}</div>
            <div class="stat-label">Active Plugins</div>
          </div>
        </div>
        <div class="card">
          <table>
            <thead><tr><th>Name</th><th>ID</th><th>Status</th><th>Version</th><th>Requests</th><th>Errors</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    // ─── Actions ────────────────────────────────────────────
    async function renderEvents() {
      const data = await apiFetch('/events/recent?limit=50');
      const events = (data && data.events) ? data.events : [];

      let rows = events.map(e => {
        const ts = new Date(e.timestamp_ms).toLocaleString();
        const sourceColor = e.source.startsWith('connector:') ? '#7c3aed' : e.source.startsWith('file') ? '#22c55e' : '#eab308';
        return `<tr>
          <td class="monospace" style="font-size:11px;">${ts}</td>
          <td><span style="color:${sourceColor};" class="monospace">${e.source}</span></td>
          <td class="monospace">${e.event_type}</td>
          <td class="monospace">${formatBytes(e.payload_size)}</td>
          <td class="monospace" style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${e.id}">${e.id}</td>
          <td>${Object.keys(e.tags || {}).length > 0 ? Object.entries(e.tags).map(([k,v]) => '<span class="badge badge-ok" style="margin-right:4px;">' + k + '=' + v + '</span>').join('') : '<span style="color:#71717a;">—</span>'}</td>
        </tr>`;
      }).join('');

      if (events.length === 0) {
        return `
          <h2 style="font-size:14px;font-weight:600;margin:0 0 16px;">Event Browser</h2>
          <div class="empty-state"><div class="icon">📋</div><p>No cached events</p></div>
        `;
      }

      return `
        <h2 style="font-size:14px;font-weight:600;margin:0 0 16px;">Event Browser <span style="font-weight:400;color:#71717a;">(${events.length} events)</span></h2>
        <div class="card" style="padding:12px;">
          <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
            <input id="event-search" type="text" placeholder="Search events..." style="flex:1;padding:6px 12px;border-radius:6px;border:1px solid #27272a;background:#18181b;color:#e4e4e7;font-size:13px;" />
            <button class="btn btn-primary btn-sm" onclick="searchEvents()">🔍 Search</button>
            <button class="btn btn-sm" onclick="navigateToPage('events')">↻ Refresh</button>
          </div>
          <div style="overflow-x:auto;">
            <table>
              <thead><tr><th>Time</th><th>Source</th><th>Type</th><th>Size</th><th>ID</th><th>Tags</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    async function searchEvents() {
      const q = document.getElementById('event-search')?.value?.trim();
      if (!q) { navigateToPage('events'); return; }
      const data = await apiFetch('/events/search?q=' + encodeURIComponent(q) + '&limit=50');
      const events = (data && data.events) ? data.events : [];
      const tbody = document.querySelector('#page-content table tbody');
      if (!tbody) return;

      if (events.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#71717a;padding:24px;">No matching events found</td></tr>';
        return;
      }
      tbody.innerHTML = events.map(e => {
        const ts = new Date(e.timestamp_ms).toLocaleString();
        const sourceColor = e.source.startsWith('connector:') ? '#7c3aed' : e.source.startsWith('file') ? '#22c55e' : '#eab308';
        return '<tr><td class="monospace" style="font-size:11px;">' + ts + '</td><td><span style="color:' + sourceColor + ';" class="monospace">' + e.source + '</span></td><td class="monospace">' + e.event_type + '</td><td class="monospace">' + formatBytes(e.payload_size) + '</td><td class="monospace" style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + e.id + '">' + e.id + '</td><td>' + Object.keys(e.tags || {}).length + ' tags</td></tr>';
      }).join('');
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
    }

    async function renderDoctor() {
      // Fetch server-rendered doctor page from the /api/page/doctor endpoint
      try {
        const resp = await fetch(API + '/page/doctor');
        if (resp.ok) {
          const data = await resp.json();
          return data.html || '<div class="empty-state"><div class="icon">🩺</div><p>Failed to load diagnostics</p></div>';
        }
      } catch (e) { /* fallback */ }
      return '<div class="empty-state"><div class="icon">🩺</div><p>Diagnostics page failed to load</p></div>';
    }

    async function toggleConnector(name, el) {
      const isEnabled = el.classList.contains('on');
      const newState = !isEnabled;
      try {
        const resp = await fetch(API + '/connectors/' + name + '/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ enabled: newState })
        });
        if (resp.ok) {
          el.classList.toggle('on');
        }
      } catch (e) { console.error('Toggle failed:', e); }
    }

    async function evictCache() {
      try {
        const resp = await fetch(API + '/cache/evict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cutoff_hours: 24 })
        });
        if (resp.ok) {
          alert('Cache eviction request sent');
        }
      } catch (e) { alert('Operation failed: ' + e.message); }
    }

    // ─── Page Router ────────────────────────────────────────
    const PAGES = {
      'dashboard': { title: 'Dashboard', render: renderDashboard },
      'connectors': { title: 'Connectors', render: renderConnectors },
      'collectors': { title: 'Collectors', render: renderCollectors },
      'events': { title: 'Event Browser', render: renderEvents },
      'sync': { title: 'Sync', render: renderSync },
      'monitor': { title: 'Monitor', render: renderMonitor },
      'doctor': { title: 'Diagnostics', render: renderDoctor },
      'config': { title: 'Config', render: renderConfig },
      'plugins': { title: 'Plugins', render: renderPlugins },
    };

    async function navigateToPage(page) {
      const pageData = PAGES[page];
      const content = document.getElementById('page-content');

      if (!pageData) {
        content.innerHTML = '<div class="empty-state"><div class="icon">🚧</div><p>Page not found: ' + page + '</p></div>';
        return;
      }

      document.getElementById('page-title').textContent = pageData.title;
      content.innerHTML = '<div style="text-align:center;padding:40px;color:#71717a;">Loading...</div>';

      try {
        const html = await pageData.render();
        content.innerHTML = html;

        // Load recent events if on monitor page
        if (page === 'monitor') {
          loadRecentEvents();
        }
      } catch (e) {
        content.innerHTML = '<div class="empty-state"><p>Load failed: ' + e.message + '</p></div>';
      }
    }

    async function loadRecentEvents() {
      const el = document.getElementById('recent-events');
      if (!el) return;
      const data = await apiFetch('/events/recent?limit=10');
      if (!data || !data.events || data.events.length === 0) {
        el.innerHTML = '<span>No recent events</span>';
        return;
      }
      el.innerHTML = '<table><thead><tr><th>Time</th><th>Source</th><th>Type</th><th>Size</th></tr></thead><tbody>' +
        data.events.map(e => '<tr><td>' + new Date(e.timestamp_ms).toLocaleString() + '</td><td class="monospace">' + e.source + '</td><td>' + e.event_type + '</td><td>' + e.payload_size + 'B</td></tr>').join('') +
        '</tbody></table>';
    }

    function handleHash() {
      const hash = location.hash.slice(1) || 'dashboard';
      navigateToPage(hash);
      // Update sidebar active state
      document.querySelectorAll('.shared-sidebar-item').forEach(item => {
        item.classList.toggle('active', item.getAttribute('data-page') === hash);
      });
    }

    window.addEventListener('hashchange', handleHash);
    handleHash();

    // ─── Status polling ─────────────────────────────────────
    async function fetchStatus() {
      const status = await apiFetch('/status');
      if (status) {
        const uptimeEl = document.getElementById('uptime');
        const statusEl = document.getElementById('header-status');
        const sidebarStatusEl = document.getElementById('sidebar-status');
        if (uptimeEl) uptimeEl.textContent = formatUptime(status.uptime_seconds);
        if (statusEl) statusEl.textContent = 'running';
        if (sidebarStatusEl) sidebarStatusEl.textContent = status.node_id;
      }
    }
    fetchStatus();
    setInterval(fetchStatus, 30000);
  </script>
</body>
</html>
