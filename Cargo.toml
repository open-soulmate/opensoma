[package]
name = "opensoma"
version = "0.1.0"
edition = "2021"
description = "Deploy Everywhere, Collect Everything — headless data collection daemon for Soul agents"
license = "MIT"
rust-version = "1.75"

[[bin]]
name = "opensoma"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

# gRPC
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client (for connectors)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# File system watching
notify = "7"
notify-debouncer-mini = "0.5"

# Local cache / persistence
sled = "0.34"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"

# System info (for heartbeat node status)
sysinfo = "0.33"

# Content hashing (for dedup)
sha2 = "0.10"

# Local IP detection
local-ip-address = "0.6"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
