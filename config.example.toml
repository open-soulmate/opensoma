# OpenSoma Configuration
# Copy to config.toml and edit.
#
# Environment variable overrides follow the pattern:
#   OPENSOMA_<SECTION>_<FIELD>
# Example: OPENSOMA_DAEMON_NODE_ID=soma-node-002

# ---------------------------------------------------------------------------
# Daemon — node identity and runtime settings
# ---------------------------------------------------------------------------
[daemon]
node_id = "soma-node-001"
log_level = "info"
data_dir = "/var/lib/opensoma"
# HTTP status server port for health checks (default: 8091)
status_port = 8091

# ---------------------------------------------------------------------------
# Soul — HTTP connection to the OpenSoul agent
# ---------------------------------------------------------------------------
[soul]
endpoint = "http://localhost:8090"
heartbeat_interval = 30
connect_timeout = 10

# ---------------------------------------------------------------------------
# Collector — file system watcher
# ---------------------------------------------------------------------------
[collector]
watch_dirs = ["/var/data/input"]
include = ["*.json", "*.csv", "*.txt", "*.log", "*.md"]
exclude = ["*.tmp", "*.swp", "~*"]
debounce_ms = 500

# ---------------------------------------------------------------------------
# Connectors — platform integrations (all disabled by default)
# ---------------------------------------------------------------------------

[connector.feishu]
enabled = false
app_id = ""
app_secret = ""
webhook_path = "/api/feishu/webhook"
folder_token = ""

[connector.dingtalk]
enabled = false
app_key = ""
app_secret = ""
agent_id = ""
robot_webhook = ""
poll_interval_secs = 60

[connector.wecom]
enabled = false
corp_id = ""
agent_id = ""
secret = ""
poll_interval_secs = 60

[connector.rss]
enabled = false
poll_interval_secs = 300
feeds = [
    { name = "Hacker News", url = "https://news.ycombinator.com/rss" },
    { name = "Rust Blog",   url = "https://blog.rust-lang.org/feed.xml" },
]

[connector.email]
enabled = false
poll_interval_secs = 120

[[connector.email.accounts]]
name = "work"
imap_server = "imap.gmail.com"
imap_port = 993
username = "you@gmail.com"
password = "app-specific-password"
folder = "INBOX"
tls = true

[connector.notion]
enabled = false
integration_token = ""
database_id = ""
poll_interval_secs = 120

[connector.git]
enabled = false
repo_url = "https://github.com/your-org/your-repo.git"
branch = "main"
local_path = "/var/lib/opensoma/repos/your-repo"
poll_interval_secs = 300

[connector.obsidian]
enabled = false
vault_path = "/home/user/Documents/MyVault"
debounce_ms = 500

[connector.webhook]
enabled = false
listen = "0.0.0.0:9800"
secret = ""
allowed_origins = ["https://open.feishu.cn"]

[connector.github]
enabled = false
token = ""
repos = ["your-org/your-repo"]
poll_interval_secs = 300
include_issues = true
include_prs = true
include_releases = true
include_closed = false
max_items_per_fetch = 30

[connector.slack]
enabled = false
bot_token = ""
channels = []
poll_interval_secs = 60
include_threads = true

# ---------------------------------------------------------------------------
# Processor — normalization and deduplication
# ---------------------------------------------------------------------------
[processor]
normalize_timestamps = true
max_event_size = 1048576
dedup_window_secs = 300
# Enable content classification (source category, content type, urgency)
enable_classify = true
# Enable content enrichment (entity extraction, keywords, summary)
enable_enrich = true

# ---------------------------------------------------------------------------
# Sync — upload engine and local cache
# ---------------------------------------------------------------------------
[sync]
batch_size = 50
upload_interval = 10
max_retries = 5
retry_backoff_ms = 1000
cache_size_mb = 512
# Conflict resolution strategy when local and server events diverge.
# Options: newest_wins (default), server_wins, local_wins, merge, keep_both
conflict_strategy = "newest_wins"

# Enable real-time event streaming alongside batch upload (default: false)
# When true, each event is also sent immediately via the /api/nerve/stream/upload endpoint.
enable_streaming = false
